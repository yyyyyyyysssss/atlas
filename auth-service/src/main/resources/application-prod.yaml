server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:sharding.yaml?placeholder-type=environment
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          min-idle: 10
          max-idle: 20
          max-active: 100
          max-wait: 5000


security:
  issuer-url: https://atlas.ys0921.sbs:4443/api/auth
  ui-url: https://atlas.ys0921.sbs:4443
  saml2:
    sp:
      authenticate-url: ${security.issuer-url}/saml2/authenticate/{registrationId}
      # SP 和 IdP 可以共用签名密钥；生产环境可根据安全策略分别管理
      signing:
        key-store: classpath:certs/atlas.p12
        key-store-password: ${ATLAS_SAML_KEYSTORE_PASSWORD}
        key-alias: saml-idp
    idp:
      entity-id: ${security.issuer-url}/saml2/idp
      sso-url: ${security.issuer-url}/saml2/idp/sso
      metadata-url: ${security.issuer-url}/saml2/idp/metadata
      signing:
        key-store: classpath:certs/atlas.p12
        key-store-password: ${ATLAS_SAML_KEYSTORE_PASSWORD}
        key-alias: saml-idp

http:
  config:
    proxy: 'http://192.168.31.121:1081'